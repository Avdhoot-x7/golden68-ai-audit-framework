# Golden 68 - AI Compliance & Audit Framework Configuration

# API Settings
gemini_api_key: ""  # Set via UI or environment

# Model Settings
models:
  judge:
    provider: "gemini"
    model: "gemini-2.0-flash"
    temperature: 0.3
  test:
    default: "gemini-2.0-flash"
    available:
      - "gemini-2.0-flash"
      - "openai/gpt-4"
      - "openai/gpt-4o"
      - "meta/llama-3.1-70b-instruct"

# Dataset Settings
dataset:
  default_name: "golden68"
  default_path: "data/dataset/golden68.json"
  archival_name: "source_750"
  archival_path: "data/dataset/archive/source_750.json"
  levels: [1, 2, 3, 4, 5]

# Scoring Settings
scoring:
  judge_scale: 10

# Output Settings
output:
  results_dir: "data/results"
  reports_dir: "data/reports"

# UI Settings
ui:
  title: "Golden 68 - AI Compliance & Audit Framework"
  theme: "light"
